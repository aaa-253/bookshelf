<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Color Log</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
 
<div class="app-container">
    <header>
        <h1>Reading Color Log</h1>
        <div id="heatmap" class="heatmap-minimal"></div>
    </header>
 
    <section class="input-area">
        <div class="input-card">
            <div class="upload-container" id="drop-area">
                <input type="file" id="cover-image" accept="image/*" onchange="previewImage(this)">
                <div id="preview-display" class="preview-placeholder">
                    <span class="icon">📸</span>
                    <p>Cover Image</p>
                </div>
            </div>
 
            <div class="form-main">
                <input id="title" type="text" placeholder="本のタイトル" maxlength="40">
                <input id="author" type="text" placeholder="著者名" maxlength="30">
                <textarea id="memo" placeholder="一言メモ（心に残ったフレーズなど）" maxlength="100"></textarea>
                
                <div class="rating-section">
                    <p class="section-label">Rating</p>
                    <div class="star-rating">
                        <input type="radio" name="rating" value="5" id="star5"><label for="star5">★</label>
                        <input type="radio" name="rating" value="4" id="star4"><label for="star4">★</label>
                        <input type="radio" name="rating" value="3" id="star3" checked><label for="star3">★</label>
                        <input type="radio" name="rating" value="2" id="star2"><label for="star2">★</label>
                        <input type="radio" name="rating" value="1" id="star1"><label for="star1">★</label>
                    </div>
                </div>

                <div class="emotion-section">
                    <p class="section-label">Reading Vibe</p>
                    <div class="emotion-palette">
                        <label class="emo-item"><input type="radio" name="emo" value="#f4a261" data-name="ワクワク" checked><span class="chip" style="--c:#f4a261"></span><span class="emo-name">ワクワク</span></label>
                        <label class="emo-item"><input type="radio" name="emo" value="#2a9d8f" data-name="落ち着く"><span class="chip" style="--c:#2a9d8f"></span><span class="emo-name">落ち着く</span></label>
                        <label class="emo-item"><input type="radio" name="emo" value="#8e44ad" data-name="深い"><span class="chip" style="--c:#8e44ad"></span><span class="emo-name">深い</span></label>
                        <label class="emo-item"><input type="radio" name="emo" value="#e76f51" data-name="悲しい"><span class="chip" style="--c:#e76f51"></span><span class="emo-name">悲しい</span></label>
                        <label class="emo-item"><input type="radio" name="emo" value="#e9c46a" data-name="幸せ"><span class="chip" style="--c:#e9c46a"></span><span class="emo-name">幸せ</span></label>
                    </div>
                </div>
 
                <button onclick="addBook()" class="submit-btn">Add to Library</button>
            </div>
        </div>
    </section>
 
    <main>
        <div class="section-header">
            <h2>Bookshelf</h2>
            <span id="book-count">0 books</span>
        </div>
        <div id="bookshelf" class="bookshelf"></div>
    </main>
</div>
 
<script src="script.js" defer></script>
</body>
</html>
